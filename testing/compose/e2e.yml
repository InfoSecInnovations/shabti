# Layered over stack.yml + runners.yml for the two end-to-end test types. Everything here is about
# wiring the one-shot runners to the live stack; nothing in it is needed by the unit tests.
#
# The healthchecks all come from the configurator fragments, and are what every runner waits on:
# none of the suites poll for a service themselves.

services:
  # Runs the app in process, so it needs the stack's backing services but not the API container.
  # Spelled out rather than inherited from shabti, which this deliberately does not depend on.
  pytest-api:
    depends_on:
      opensearch-node1:
        condition: service_healthy
      llama-cpp:
        condition: service_healthy
      tika:
        condition: service_healthy
    volumes:
      - shabti-files:/opt/shabti_files

  # shabti is only healthy once everything it depends on is, see stack.yml
  pytest-python-client:
    depends_on:
      shabti:
        condition: service_healthy

  bun-tests:
    depends_on:
      shabti:
        condition: service_healthy
