name: shabti

# The long running Shabti services. Only the test types that actually need a live stack layer this
# file in, which is what keeps a unit run from paying for an OpenSearch cold start.

include:
  - ../../shabti_configurator/docker_compose/docker_compose_dependencies/${KEYCLOAK_SERVICE_FILE:-docker-compose-blank.yml}

services:
  llama-cpp:
    extends:
      file: ../../shabti_configurator/docker_compose/docker_compose_dependencies/docker-compose-llama-cpp.yml
      service: llama-cpp-${SHABTI_COMPUTE:-cpu}
  opensearch-node1:
    extends:
      file: ../../shabti_configurator/docker_compose/docker_compose_dependencies/docker-compose-opensearch.yml
      service: opensearch-node-base
  tika:
    extends:
      file: ../../shabti_configurator/docker_compose/docker_compose_dependencies/docker-compose-tika.yml
      service: tika
  shabti:
    extends:
      file: ../../shabti_configurator/docker_compose/docker_compose_dependencies/docker-compose-shabti.yml
      service: ${SHABTI_SERVICE:-shabti}
    build:
      context: ../../docker_containers/shabti_api
      additional_contexts:
        python_packages: ../../python_packages
      dockerfile: Dockerfile
      target: local
    # healthy rather than just started, so that shabti being healthy - which is what the runners
    # wait on - means the whole stack is: a suite that only depends on shabti can't reach a service
    # that is still coming up. The healthchecks themselves come from the configurator fragments.
    depends_on:
      opensearch-node1:
        condition: service_healthy
      llama-cpp:
        condition: service_healthy
      tika:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opensearch-data1:
  llama-cpp-models:
  llama-cpp-cache:
  shabti-files:

networks:
  default:
    name: shabti
