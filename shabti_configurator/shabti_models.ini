[mistral7b]
hf = bartowski/Mistral-7B-Instruct-v0.3-GGUF:Q4_K_M
tags = chat, default

[paraphrase-multilingual]
hf = mykor/paraphrase-multilingual-mpnet-base-v2.gguf:Q4_K_M
tags = embeddings
shabti_chunk_size = 128

[snowflake-arctic]
; the tag after the colon is resolved by llama.cpp against HuggingFace rather than being a filename,
; and for this repository BF16 and F16 come back as the same blob, so F16 is not selectable at all.
; BF16 was what this said, and it produced NaN for every input on a card older than Ampere - which
; reaches OpenSearch as a vector of nulls and fails the ingest, since llama.cpp writes NaN as JSON
; null. Q8_0 is a distinct file and computes on anything
hf = Snowflake/snowflake-arctic-embed-m-v1.5:Q8_0
tags = embeddings
; an asymmetric model: it was trained with this in front of a search query and nothing in front of
; the passages searched, so leaving it off costs retrieval quality silently. written quoted because
; the trailing space is part of it
shabti_query_prefix = "Represent this sentence for searching relevant passages: "

[qwen2.5]
hf = madhusudhan001/qwen2.5-0.5b-materials-science:Q8_0
tags = chat
