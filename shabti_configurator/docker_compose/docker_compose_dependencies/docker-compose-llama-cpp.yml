services:

  llama-cpp-cpu:
    container_name: llama_cpp
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10630
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - "LLAMA_CACHE=/models/hub"  
    volumes:
      - llama-cpp-models:/models
      - ./llama_models/my-models.ini:/my-models.ini
    # the batch sizes live in the preset file's global section rather than here: the router overlays
    # its own command line arguments on top of every preset section, so a model which needs a larger
    # physical batch than the default could never override one set here
    command: ["--models-preset", "/my-models.ini", "--embeddings", "--port", "11434"]
    # replaces the image's own, which probes the default port 8080 rather than the one above
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:11434/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15m
      start_interval: 2s
  llama-cpp-cuda:
    extends: llama-cpp-cpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]