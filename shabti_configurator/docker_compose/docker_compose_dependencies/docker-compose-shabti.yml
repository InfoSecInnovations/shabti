services:
  shabti:
    image: infosecinnovations/shabti:${SHABTI_API_VERSION:-latest}
    container_name: shabti
    environment:
      - OPENSEARCH_HOST=opensearch-node1
      # empty for an installation whose models are all remote, which has no llama.cpp
      - LLM_HOST=${LLM_HOST-llama_cpp}
      - MODEL_LOADER_HOST=huggingface-downloader
      - SHABTI_SECURITY_ENABLED=False
      - SHABTI_LOGGING_ENABLED=False
      - SHABTI_FILES_DIR=/opt/shabti_files
      - 'TIKA_SERVER_ENDPOINT=http://tika:9998'
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - ${API_PORT:-15131}:15131
    volumes:
      - shabti-files:/opt/shabti_files
      # the model providers the installer recorded. the directory rather than the file so that
      # rewriting it is visible to a running container
      - ./shabti_config:/opt/shabti_config:ro
      # the provider keys and the instance salt, mounted into the API alone
      - ./secrets:/run/secrets:ro
      # the settings the installer recorded about the selected embeddings model. the directory
      # rather than the file so that rewriting it is visible to a running container
      - ./llama_models:/opt/shabti_models:ro
    healthcheck:
      test: ["CMD", "/app/shabti/.venv/bin/python", "healthcheck.py"]
      interval: 10s
      timeout: 10s
      retries: 3
      # docker_run.py doesn't start the server until llama.cpp answers, if there is one, which can
      # take a long while on a cold start
      start_period: 15m
      start_interval: 2s
    restart: unless-stopped
  shabti-logging:
    extends: shabti
    environment:
      - SHABTI_LOGGING_ENABLED=True
      - SHABTI_LOG_DIR=/logs
    volumes:
      - ${SHABTI_LOG_DIR:-empty}:/logs
  shabti-disable-security:
    extends: ${SHABTI_BASE_SERVICE:-shabti}
  shabti-enable-security:
    extends: ${SHABTI_BASE_SERVICE:-shabti}
    environment:
      - KEYCLOAK_HOST=keycloak
      - SHABTI_SECURITY_ENABLED=True
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - ROOT_CA=/opensearch_certs/root-ca.pem
      # the demo's accounts are shared, so users can't bring their own provider keys to it
      - IS_SECURITY_DEMO=${IS_SECURITY_DEMO:-False}
    volumes:
      # even if this config isn't used, Docker complains about empty strings so we add a placeholder here
      - ${API_CERT:-empty}:/api_certs/cert.pem
      - ${API_KEY:-empty}:/api_certs/key.pem
      - ${ROOT_CA:-empty}:/opensearch_certs/root-ca.pem
  shabti-web:
    image: infosecinnovations/shabti-web:${SHABTI_WEB_VERSION:-latest}
    container_name: shabti-web
    environment:
      - SHABTI_SECURITY_ENABLED=False
      - API_HOST=shabti
      - API_PORT=${API_PORT:-15131}
    ports:
      - ${WEB_PORT:-15130}:15130
    healthcheck:
      test: ["CMD", "/app/shabti_web/.venv/bin/python", "healthcheck.py"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 2m
      start_interval: 2s
    restart: unless-stopped
  shabti-web-enable-security:
    extends: shabti-web
    environment:
      - KEYCLOAK_HOST=keycloak
      - SHABTI_SECURITY_ENABLED=True
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - ROOT_CA=/opensearch_certs/root-ca.pem
      # the demo's accounts are shared, so users can't bring their own provider keys to it
      - IS_SECURITY_DEMO=${IS_SECURITY_DEMO:-False}
    volumes:
      # even if this config isn't used, Docker complains about empty strings so we add a placeholder here
      - ${WEB_CERT:-empty}:/web_certs/cert.pem
      - ${WEB_KEY:-empty}:/web_certs/key.pem
      - ${ROOT_CA:-empty}:/opensearch_certs/root-ca.pem
