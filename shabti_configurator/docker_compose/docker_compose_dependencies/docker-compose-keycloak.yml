services:
  postgres:
    container_name: postgres
    image: postgres:18.3
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.5.6
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_INITIAL_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_PASSWORD=${POSTGRES_DB_PASSWORD}
      - KC_DB_SCHEMA=public
      - KC_DB_USERNAME=keycloak
      - KC_DB_URL_HOST=postgres
      - KC_DB_URL_DATABASE=keycloak
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/tls/cert.pem
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/tls/key.pem
      # Keycloak advertises these URLs in its discovery document, so a client that discovers them
      # rather than constructing them itself can only reach Keycloak wherever this says. Spelled as
      # a full URL because hostname-backchannel-dynamic below is only allowed with one.
      - KC_HOSTNAME=https://${WEB_HOST:-localhost}:8443
      # On for the tests, which reach Keycloak by container name rather than on localhost. It makes
      # the backchannel URLs -- token, jwks, introspection -- follow the host of the request that
      # asked for them, while the browser facing ones stay pinned to KC_HOSTNAME above.
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=${KEYCLOAK_BACKCHANNEL_DYNAMIC:-false}
      - SHABTI_HOST=${WEB_HOST:-localhost}
      - SHABTI_PORT=${WEB_PORT:-15130}
      # the health endpoints, on the management port. plain http there so the healthcheck below can
      # reach them without a TLS client, which the image doesn't have
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_MANAGEMENT_SCHEME=http
    # no curl or wget in the image, so the request is made by hand over bash's /dev/tcp
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m
      start_interval: 2s
    restart: unless-stopped
    volumes:
      - ./keycloak_import:/opt/keycloak/data/import
      - ./keycloak_javascript/shabti.jar:/opt/keycloak/providers/shabti.jar
      - ${KEYCLOAK_CERT}:/opt/keycloak/tls/cert.pem
      - ${KEYCLOAK_CERT_KEY}:/opt/keycloak/tls/key.pem
    command: start --import-realm --features=scripts

volumes:
  postgres_data: