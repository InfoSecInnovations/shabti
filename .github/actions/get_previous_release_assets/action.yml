name: Get Previous Release Assets
description: Get assets from the release preceding the one being published
inputs:
  tag:
    description: >
      Tag of the release to take the assets from. Leave empty to use the latest release, which excludes
      prereleases.
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Create directory for release files
      shell: bash
      run: mkdir -p ./release_assets
    # a composite action has no secrets context, so the token is passed explicitly rather than relying
    # on the fetch action's own default
    - name: Get previous Windows release files
      uses: Resonance1584/fetch-gh-release-asset@c5a5e5c4c4fa20db7551e58b354bdfde09d13f3e # 1.1.2
      with:
        version: ${{ inputs.tag && format('tags/{0}', inputs.tag) || 'latest' }}
        token: ${{ github.token }}
        file: "shabti_win.zip"
        target: ./release_assets/shabti_win.zip
    - name: Get previous Linux release files
      uses: Resonance1584/fetch-gh-release-asset@c5a5e5c4c4fa20db7551e58b354bdfde09d13f3e # 1.1.2
      with:
        version: ${{ inputs.tag && format('tags/{0}', inputs.tag) || 'latest' }}
        token: ${{ github.token }}
        file: "shabti_linux.zip"
        target: ./release_assets/shabti_linux.zip
    - name: Get previous Mac release files
      uses: Resonance1584/fetch-gh-release-asset@c5a5e5c4c4fa20db7551e58b354bdfde09d13f3e # 1.1.2
      with:
        version: ${{ inputs.tag && format('tags/{0}', inputs.tag) || 'latest' }}
        token: ${{ github.token }}
        file: "shabti_mac.zip"
        target: ./release_assets/shabti_mac.zip

    - name: Unzip previous files
      shell: bash
      run: |
        mkdir -p ./unzipped/win
        mkdir -p ./unzipped/linux
        mkdir -p ./unzipped/mac
        unzip -qq ./release_assets/shabti_win.zip -d ./unzipped/win
        unzip -qq ./release_assets/shabti_mac.zip -d ./unzipped/mac
        unzip -qq ./release_assets/shabti_linux.zip -d ./unzipped/linux
