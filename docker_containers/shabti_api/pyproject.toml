[project]
name = "shabti-api"
version = "0.1.0"
requires-python = ">=3.14, <3.15"
dependencies = [
    "beautifulsoup4==4.15.0",
    "configobj==5.0.9",
    "crawlee[beautifulsoup]==1.9.3",
    "fastapi[standard]==0.141.1",
    "lxml==6.1.2",
    "opensearch-py[async]==3.0.0",
    "python-json-logger==4.2.0",
    "aiofiles==25.1.0",
    "requests==2.34.2",
    "semantic-text-splitter==0.32.0",
    "trafilatura==2.2.0",
    "httpx-sse==0.4.3",
    "isi-util",
    "shabti-util",
    "shabti-types",
    "shabti-keycloak",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.4.0",
]

# these paths are only valid inside the container, run uv lock in Docker (see docs/developer/LOCKFILES.md)
[tool.uv.sources]
isi-util = { path = "/app/python_packages/isi_util", editable = true }
shabti-util = { path = "/app/python_packages/shabti_util", editable = true }
shabti-types = { path = "/app/python_packages/shabti_types", editable = true }
shabti-keycloak = { path = "/app/python_packages/shabti_keycloak", editable = true }

[tool.pytest.ini_options]
asyncio_mode="auto"
# the OpenSearch client binds to the loop it first ran on, so the whole suite shares one: the
# fixtures and tests on pytest's loop, and every request through the TestClient portal's
asyncio_default_fixture_loop_scope="session"
asyncio_default_test_loop_scope="session"
addopts = "--import-mode=importlib"
# a hung ingest used to block the whole suite silently with no way to tell where. this turns one
# into a single failed test; --timeout-method=thread dumps every thread instead, at the cost of
# aborting the run
timeout = 300
